<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Santiago's City</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:#87CEEB; touch-action:none;
  font-family:'Comic Sans MS', cursive;
  -webkit-tap-highlight-color:transparent; user-select:none;
}
canvas { position:fixed; top:0; left:0; width:100%; height:100%; touch-action:none; }
.pop {
  position:fixed; pointer-events:none; font-size:50px; z-index:999;
  animation:popUp .9s ease-out forwards;
}
@keyframes popUp {
  0%   { transform:scale(0) translateY(0); opacity:1; }
  30%  { transform:scale(1.4) translateY(-18px); opacity:1; }
  100% { transform:scale(.6) translateY(-85px); opacity:0; }
}
#toolbar {
  position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
  display:flex; gap:10px; z-index:500; padding:8px 12px;
  background:rgba(255,255,255,.35); border-radius:40px;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  box-shadow:0 4px 18px rgba(0,0,0,.18);
  touch-action:manipulation;
}
.tool {
  width:54px; height:54px; border-radius:50%; border:none;
  font-size:26px; cursor:pointer; background:rgba(255,255,255,.85);
  box-shadow:0 2px 6px rgba(0,0,0,.2); transition:transform .12s;
  display:flex; align-items:center; justify-content:center;
  touch-action:manipulation; -webkit-tap-highlight-color:rgba(0,0,0,0);
}
.tool:active { transform:scale(.88); }
.tool.active { background:#ffd54f; box-shadow:0 0 0 3px #fff,0 2px 10px rgba(0,0,0,.3); }
#palette {
  position:fixed; left:50%; bottom:80px; transform:translateX(-50%);
  display:none; gap:8px; z-index:500; padding:8px 12px;
  background:rgba(255,255,255,.45); border-radius:30px;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  flex-wrap:wrap; max-width:92vw; justify-content:center;
}
#palette.show { display:flex; }
.swatch {
  width:44px; height:44px; border-radius:50%; border:3px solid #fff;
  cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,.25); font-size:22px;
  display:flex; align-items:center; justify-content:center; background:#fff;
  touch-action:manipulation; -webkit-tap-highlight-color:rgba(0,0,0,0);
}
.swatch:active { transform:scale(.85); }
#shop {
  position:fixed; left:0; right:0; bottom:78px; z-index:480;
  display:none; flex-direction:column; gap:6px;
  background:rgba(255,255,255,.55); backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px); padding:8px 6px 10px;
  box-shadow:0 -4px 18px rgba(0,0,0,.15);
  border-top-left-radius:18px; border-top-right-radius:18px;
}
#shop.show { display:flex; }
#shop-cats {
  display:flex; gap:6px; overflow-x:auto; padding:2px 6px;
  -webkit-overflow-scrolling:touch;
}
.cat {
  flex:0 0 auto; padding:6px 14px; border:none; border-radius:18px;
  background:rgba(255,255,255,.8); font-size:15px; cursor:pointer;
  font-family:inherit; white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.15);
  touch-action:manipulation; -webkit-tap-highlight-color:rgba(0,0,0,0);
}
.cat.active { background:#ffd54f; font-weight:bold; }
#shop-items {
  display:flex; gap:8px; overflow-x:auto; padding:4px 6px 2px;
  -webkit-overflow-scrolling:touch; min-height:62px; align-items:center;
}
.shop-item {
  flex:0 0 auto; width:58px; height:58px; border:none; border-radius:14px;
  background:rgba(255,255,255,.9); font-size:30px; cursor:pointer;
  box-shadow:0 2px 5px rgba(0,0,0,.18); transition:transform .1s;
  display:flex; align-items:center; justify-content:center;
  touch-action:manipulation; -webkit-tap-highlight-color:rgba(0,0,0,0);
}
.shop-item:active { transform:scale(.85); background:#fff3c4; }

// ── On-screen error reporter (shows the real error instead of a white screen) ──
window.onerror = function(msg, src, line, col, error) {
  let box = document.getElementById('errbox');
  if (!box) {
    box = document.createElement('div');
    box.id = 'errbox';
    box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#b71c1c;color:#fff;font:14px monospace;padding:12px;white-space:pre-wrap;word-break:break-word;max-height:60%;overflow:auto;';
    document.body.appendChild(box);
  }
  box.textContent = 'ERROR: ' + msg + '\nLine: ' + line + ':' + col + (error && error.stack ? '\n' + error.stack : '');
  return false;
};
</script>

let ac;
function getAC(){ return ac || (ac = new (window.AudioContext||window.webkitAudioContext)()); }
function beep(notes, type='sine', vol=.22) {
  try {
    const c = getAC();
    notes.forEach(([f,t,d]) => {
      const o=c.createOscillator(), g=c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type=type; o.frequency.setValueAtTime(f, c.currentTime+t);
      g.gain.setValueAtTime(vol, c.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001, c.currentTime+t+d);
      o.start(c.currentTime+t); o.stop(c.currentTime+t+d+.02);
    });
  } catch(e){}
}
const SFX = {
  happy:  ()=>beep([[440,0,.08],[550,.08,.08],[660,.16,.15],[880,.24,.2]]),
  squeak: ()=>beep([[800,0,.04],[600,.04,.08],[700,.1,.1]],'triangle',.18),
  pop:    ()=>beep([[500,0,.04],[300,.04,.08]],'sine',.28),
  boing:  ()=>beep([[300,0,.05],[600,.05,.12],[400,.15,.15]],'triangle'),
  door:   ()=>beep([[200,0,.1],[300,.1,.1],[400,.2,.15]],'triangle',.2),
  place:  ()=>beep([[600,0,.05],[800,.05,.1]],'sine',.22),
  tada:   ()=>beep([[523,0,.1],[659,.08,.1],[784,.16,.12],[1047,.26,.25]],'sine',.25),
  switch: ()=>beep([[900,0,.05],[600,.06,.08]],'square',.15),
  bubble: ()=>beep([[400,0,.05],[600,.06,.05],[800,.12,.06],[500,.18,.08]],'sine',.16),
  sizzle: ()=>beep([[200,0,.08],[250,.06,.08],[180,.13,.12]],'sawtooth',.1),
  snore:  ()=>beep([[180,0,.3],[140,.35,.35]],'sine',.12),
  tv:     ()=>beep([[660,0,.08],[880,.09,.08],[660,.18,.08],[990,.27,.12]],'square',.1),
};

}
function roomW() { return Math.max(W * .92, 480); }
function cam()   { return cams[scene] || 0; }
function setCam(v) { cams[scene] = Math.max(0, Math.min(v, sceneW() - W)); }

// Night mode per scene (lamp toggles)
const nightMode = {};

// ════════════════════════════════════════════
// CHARACTERS (canvas-drawn)
// ════════════════════════════════════════════
class Char {
  constructor(cfg) {
    Object.assign(this, { vx:0, vy:0, scale:1, targetScale:1, wiggle:0, happy:0,
      dragged:false, z:1, scene:'street', sleeping:false, emotion:0, emotionFace:'😊',
      tint:null, hat:null, held:[], ...cfg });
    this.baseY = cfg.y;
  }
  get cx() { return this.x - (this.scene===scene ? cam() : 0); }
  get cy() { return this.y; }
  get r()  { return this.size * this.scale * .5; }
  hit(sx, sy) { return Math.hypot(sx-this.cx, sy-this.cy) < this.r * 1.25; }
  showEmotion(face, dur=1.6) { this.emotionFace=face; this.emotion=dur; }
  bounce() {
    this.targetScale = 1.4; this.happy = 1; this.sleeping = false;
    SFX.happy();
    popEmoji(this.cx, this.cy-this.r, ['❤️','⭐','🎉','✨','😊'][Math.floor(Math.random()*5)]);
  }
  pickUp(item) {
    if (this.held.length>=2) return false;
    item.heldBy = this;
    this.held.push(item);
    this.showEmotion('😄', 1.2);
    SFX.pop();
    return true;
  }
  dropAll() {
    for (const it of this.held) {
      it.heldBy = null;
      it.scene = this.scene;
      it.x = this.x + (Math.random()-.5)*60;
      it.y = this.baseY + this.r*.3;
    }
    this.held = [];
  }
  update(dt) {
    this.scale += (this.targetScale-this.scale)*.18;
    if (Math.abs(this.scale-this.targetScale)<.01 && this.targetScale>1) this.targetScale=1;
    if (this.happy>0) { this.happy-=dt*.8; this.wiggle=Math.sin(Date.now()*.02)*8; }
    else this.wiggle*=.85;
    if (this.emotion>0) this.emotion-=dt;
    if (this.sleeping) {
      this.wiggle = Math.sin(Date.now()*.003)*3;
      if (Math.random()<.008) { popEmoji(this.cx+this.r*.6, this.cy-this.r, '💤'); }
    }
    if (!this.dragged && !this.sleeping) {
      if (this.y < this.baseY) { this.vy += 900*dt; this.y += this.vy*dt;
        if (this.y>=this.baseY){ this.y=this.baseY; this.vy=0; this.targetScale=1.25; SFX.boing(); } }
      else this.y = this.baseY + Math.sin(Date.now()*.0009+this.x*.01)*4;
    }
    // Held items follow hands
    this.held.forEach((it,i) => {
      it.scene = this.scene;
      it.x = this.x + (i===0?-this.r*.55:this.r*.55);
      it.y = this.y + this.r*.25;
    });
  }
  draw() {
    const x=this.cx, y=this.cy, s=this.size*this.scale;
    ctx.save(); ctx.translate(x,y); ctx.rotate(this.wiggle*Math.PI/180);
    if (this.sleeping) ctx.globalAlpha = .8;
    ctx.beginPath(); ctx.ellipse(0,s*.4,s*.26,s*.07,0,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,.16)'; ctx.fill();
    if (this.tint) { ctx.save(); ctx.globalCompositeOperation='source-over'; }
    this._draw(s);
    if (this.tint) { ctx.restore();
      ctx.save(); ctx.globalCompositeOperation='source-atop';
      ctx.fillStyle=this.tint; ctx.globalAlpha=.32;
      ctx.beginPath(); ctx.arc(0,0,s*.7,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    // Hat / accessory
    if (this.hat) {
      ctx.font = s*.42+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(this.hat, 0, -s*.62);
    }
    if (this.sleeping) {
      ctx.font = s*.3+'px serif'; ctx.textAlign='center';
      ctx.fillText('💤', s*.5, -s*.5);
    }
    // Emotion bubble
    if (this.emotion>0 && !this.sleeping) {
      ctx.globalAlpha = Math.min(1,this.emotion*1.5);
      ctx.font = s*.34+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.beginPath(); ctx.arc(s*.5,-s*.6,s*.26,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fill();
      ctx.fillText(this.emotionFace, s*.5, -s*.6);
    }
    ctx.restore();
  }
  _draw(s){}
}

class Peppa extends Char { _draw(s){ const c=s*.5;
  ctx.lineWidth=s*.022; ctx.strokeStyle='#e07070';
  ctx.beginPath();ctx.ellipse(0,c*.35,c*.55,c*.62,0,0,7);ctx.fillStyle='#f9a0a0';ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,c*.55,c*.52,c*.4,0,0,7);ctx.fillStyle='#ff4444';ctx.fill();
  for(const sd of[-1,1]){
    ctx.beginPath();ctx.ellipse(sd*c*.55,c*.1,c*.17,c*.3,sd*.4,0,7);ctx.fillStyle='#f9a0a0';ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(sd*c*.66,c*.35,c*.12,0,7);ctx.fillStyle='#f9a0a0';ctx.fill();
    ctx.beginPath();ctx.ellipse(sd*c*.27,c*.88,c*.14,c*.27,0,0,7);ctx.fillStyle='#f9a0a0';ctx.fill();
    ctx.beginPath();ctx.ellipse(sd*c*.3,c*1.1,c*.19,c*.09,sd*.3,0,7);ctx.fillStyle='#222';ctx.fill();
  }
  ctx.beginPath();ctx.arc(0,-c*.22,c*.48,0,7);ctx.fillStyle='#f9a0a0';ctx.fill();ctx.stroke();
  for(const sd of[-1,1]){
    ctx.beginPath();ctx.ellipse(sd*c*.36,-c*.62,c*.13,c*.17,sd*.3,0,7);ctx.fillStyle='#f9a0a0';ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.ellipse(sd*c*.36,-c*.62,c*.07,c*.09,sd*.3,0,7);ctx.fillStyle='#ffb8b8';ctx.fill();
  }
  ctx.beginPath();ctx.ellipse(c*.27,-c*.1,c*.2,c*.15,.3,0,7);ctx.fillStyle='#f0b0b0';ctx.fill();ctx.stroke();
  ctx.fillStyle='#c06060';
  ctx.beginPath();ctx.arc(c*.2,-c*.1,c*.05,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(c*.34,-c*.1,c*.05,0,7);ctx.fill();
  ctx.fillStyle='#333';
  ctx.beginPath();ctx.arc(-c*.1,-c*.3,c*.06,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(c*.1,-c*.32,c*.06,0,7);ctx.fill();
  ctx.fillStyle='white';
  ctx.beginPath();ctx.arc(-c*.08,-c*.32,c*.022,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(c*.12,-c*.34,c*.022,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(0,-c*.14,c*.14,.2,Math.PI-.2);ctx.strokeStyle='#c06060';ctx.stroke();
}}

class Dog extends Char { _draw(s){ const c=s*.5;
  ctx.lineWidth=s*.022; ctx.strokeStyle='#b07040';
  ctx.beginPath();ctx.ellipse(0,c*.3,c*.5,c*.6,0,0,7);ctx.fillStyle='#d4956a';ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,c*.5,c*.48,c*.36,0,0,7);ctx.fillStyle='#4488ff';ctx.fill();
  for(const sd of[-1,1]){

// Stack a cart's cargo items neatly above/inside it so they travel together
function positionCargo(cart) {
  const n = cart.cargo.length;
  cart.cargo.forEach((it,i) => {
    const cols = Math.min(3, n);
    const col = i % cols, row = Math.floor(i / cols);
    const spread = cart.size * 0.32;
    it.x = cart.x + (col - (cols-1)/2) * spread;
    it.y = cart.y - cart.size*0.45 - row * spread*0.7;
    it.place = 'free';
  });
}

// Floor line per scene (where the ground starts)
function floorLineY() { return scene==='street' ? H*.78 : H*.78; }

class Item {
  constructor(cfg) {
    Object.assign(this, { scale:1, targetScale:1, wiggle:0, z:0, special:null,
      on:false, heldBy:null, place:'free', cargo:[], inCart:null, ...cfg });
  }
  get isCart() { return this.emoji==='🛒' || this.emoji==='🧺'; }
  get cx() { return this.x - (this.scene===scene ? cam() : 0); }
  get cy() { return this.y; }
  get r()  { return this.size * this.scale * .5; }
  hit(sx,sy) { return Math.hypot(sx-this.cx, sy-this.drawCy) < this.r*1.35; }
  update(dt) {
    this.scale += (this.targetScale-this.scale)*.16;
    if (Math.abs(this.scale-this.targetScale)<.01 && this.targetScale>1) this.targetScale=1;
    this.wiggle *= .88;
  }
  // For floor items, this.y is the BASE (bottom). Centre is lifted by half-height.
  get drawCy() {
    if (this.place==='floor') return this.cy - this.size*this.scale*.5;
    return this.cy;
  }
  draw() {
    ctx.save();
    ctx.translate(this.cx, this.drawCy);
    ctx.rotate(this.wiggle*Math.PI/180);
    // Floor shadow under standing furniture
    if (this.place==='floor') {
      const s=this.size*this.scale;
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(0, s*.46, s*.34, s*.08, 0, 0, Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,.16)'; ctx.fill();
      ctx.restore();
    }
    // TV: draw screen content when on
    if (this.special==='tv' && this.on) {
      const s=this.size*this.scale;
      ctx.fillStyle='#222';
      ctx.fillRect(-s*.45, -s*.35, s*.9, s*.62);
      const shows=['🐭','🚗','🦖','⚽','🌈','🐷'];
      const show=shows[Math.floor(Date.now()/1500)%shows.length];
      ctx.font=s*.4+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(show, 0, -s*.05);
      ctx.fillStyle='#555';
      ctx.fillRect(-s*.45, s*.27, s*.9, s*.1);
    } else {
      ctx.font = (this.size*this.scale) + 'px serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(this.emoji, 0, 0);
    }
    // Glow for lamps that are on
    if (this.special==='lamp' && this.on) {
      const s=this.size*this.scale;
      const g = ctx.createRadialGradient(0,-s*.2,2, 0,-s*.2, s*1.6);
      g.addColorStop(0,'rgba(255,235,130,.5)');
      g.addColorStop(1,'rgba(255,235,130,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(0,-s*.2,s*1.6,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

// CARS
// ════════════════════════════════════════════
const cars = [
  { x:0,    speed:90,  emoji:'🚗', dir:1 },
  { x:1500, speed:70,  emoji:'🚕', dir:1 },
  { x:2800, speed:110, emoji:'🚙', dir:-1 },
  { x:800,  speed:60,  emoji:'🚌', dir:-1 },
  { x:3500, speed:95,  emoji:'🚓', dir:1 },
  { x:4200, speed:80,  emoji:'🚐', dir:-1 },
];
function updateCars(dt) {
  for (const c of cars) {
    c.x += c.speed*c.dir*dt;
    if (c.dir>0 && c.x>STREET_W+100) c.x=-100;
    if (c.dir<0 && c.x<-100) c.x=STREET_W+100;
  }
}
function drawCars() {
  for (const c of cars) {
    const sx = c.x - cam();
    if (sx<-80||sx>W+80) continue;
    ctx.save(); ctx.translate(sx, H*.885);
    ctx.scale(c.dir<0?-1:1,1);
    ctx.font=H*.07+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(c.emoji,0,0);
    ctx.restore();
  }
}

// DRAW STREET
// ════════════════════════════════════════════
function drawStreet(t) {
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#6ec6f5'); sky.addColorStop(.55,'#b8e4fa');
  sky.addColorStop(.55,'#9ccc65'); sky.addColorStop(.70,'#8bc34a');   // grass strip
  sky.addColorStop(.70,'#d7ccc8'); sky.addColorStop(.78,'#bcaaa4');   // sidewalk
  sky.addColorStop(.78,'#9e9e9e'); sky.addColorStop(.86,'#757575');   // road
  sky.addColorStop(.86,'#616161'); sky.addColorStop(1,'#555');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  // curb highlight between sidewalk and road
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.fillRect(0,H*.78,W,4);

  // sidewalk paving lines
  ctx.strokeStyle='rgba(0,0,0,.08)'; ctx.lineWidth=2;
  for (let x=0;x<STREET_W;x+=70) {
    const sx=x-cam(); if (sx<-70||sx>W+70) continue;
    ctx.beginPath(); ctx.moveTo(sx,H*.78); ctx.lineTo(sx,H*.86); ctx.stroke();
  }

  ctx.font='70px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('☀️', 90-cam()*.2, H*.1);
  ctx.font='52px serif';
  ctx.fillText('☁️', 300-cam()*.3+Math.sin(t*.2)*15, H*.08);
  ctx.fillText('☁️', 900-cam()*.3+Math.sin(t*.25+2)*15, H*.13);
  ctx.fillText('⛅', 1700-cam()*.3+Math.sin(t*.22+4)*15, H*.07);
  ctx.fillText('☁️', 2500-cam()*.3+Math.sin(t*.28+1)*15, H*.11);
  ctx.fillText('☁️', 3600-cam()*.3+Math.sin(t*.24+3)*15, H*.09);

  // road centre dashes
  ctx.fillStyle='rgba(255,255,100,.8)';
  for (let x=0;x<STREET_W;x+=120) {
    const sx=x-cam();
    if (sx<-60||sx>W+60) continue;
    ctx.fillRect(sx,H*.91,56,6);
  }

  for (const b of BUILDINGS) {
    if (b.id==='park') { drawPark(b,t); continue; }
    drawBuilding(b,t);
  }
  drawStreetDeco(t);
  drawCars();
}

function drawBuilding(b,t) {
  const sx = b.x - cam();
  if (sx+b.w<-50||sx>W+50) return;
  const bh = H*b.h, by = H*.78-bh;
  const groundY = H*.78;

  // ── Facade base with subtle vertical shading ──
  const fg = ctx.createLinearGradient(sx,by,sx,groundY);
  fg.addColorStop(0, shade(b.color, 18));
  fg.addColorStop(1, shade(b.color, -12));
  ctx.fillStyle=fg;
  ctx.fillRect(sx,by,b.w,bh);

  // ── Texture: brick rows for shops/market, clapboard for house ──
  ctx.save();
  ctx.beginPath(); ctx.rect(sx,by,b.w,bh); ctx.clip();
  if (b.style==='house') {
    // horizontal clapboard siding
    ctx.strokeStyle='rgba(0,0,0,.10)'; ctx.lineWidth=2;
    for (let yy=by+14; yy<groundY; yy+=16) {
      ctx.beginPath(); ctx.moveTo(sx,yy); ctx.lineTo(sx+b.w,yy); ctx.stroke();
    }
  } else {
    // brick pattern
    ctx.strokeStyle='rgba(0,0,0,.08)'; ctx.lineWidth=1.5;
    const bw=26, bhh=13;
    for (let row=0, yy=by+10; yy<groundY; yy+=bhh, row++) {
      ctx.beginPath(); ctx.moveTo(sx,yy); ctx.lineTo(sx+b.w,yy); ctx.stroke();
      const off = (row%2)*(bw/2);
      for (let xx=sx+off; xx<sx+b.w; xx+=bw) {
        ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx,yy+bhh); ctx.stroke();
      }
    }
  }
  ctx.restore();

  // ── Outline ──
  ctx.strokeStyle='rgba(0,0,0,.22)'; ctx.lineWidth=3;
  ctx.strokeRect(sx,by,b.w,bh);

  // ── Roof ──
  if (b.style==='house') {
    // ── Realistic house: peaked roof with overhang, chimney, porch, fence ──

    // Roof (full triangle with overhang)
    const roofPeak = by - bh*.32;
    ctx.beginPath();
    ctx.moveTo(sx - 28, by);
    ctx.lineTo(sx + b.w/2, roofPeak);
    ctx.lineTo(sx + b.w + 28, by);
    ctx.closePath();
    ctx.fillStyle = b.roof; ctx.fill();
    // Roof shading (dark right side)
    const rg = ctx.createLinearGradient(sx, by, sx+b.w+28, by);
    rg.addColorStop(0,'rgba(0,0,0,0)');
    rg.addColorStop(1,'rgba(0,0,0,.18)');
    ctx.fillStyle=rg; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.22)'; ctx.lineWidth=2; ctx.stroke();
    // Roof ridge cap
    ctx.strokeStyle=shade(b.roof,-30); ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(sx+b.w/2-22, roofPeak+6); ctx.lineTo(sx+b.w/2+22, roofPeak+6); ctx.stroke();
    // Roof tiles — rows of scallop lines
    ctx.save(); ctx.clip();  // already have the roof path clipped from above? re-clip:
    ctx.beginPath();
    ctx.moveTo(sx-28,by); ctx.lineTo(sx+b.w/2, roofPeak); ctx.lineTo(sx+b.w+28,by); ctx.closePath();
    ctx.clip();
    ctx.strokeStyle='rgba(0,0,0,.12)'; ctx.lineWidth=1.5;
    for (let ry=by-10; ry>roofPeak; ry-=14) {
      ctx.beginPath(); ctx.moveTo(sx-30,ry); ctx.lineTo(sx+b.w+30,ry); ctx.stroke();
    }
    ctx.restore();

    // Chimney (left of peak)
    const chx = sx+b.w*.65, chy = roofPeak+4;
    ctx.fillStyle=shade(b.roof,-28);
    ctx.fillRect(chx, chy-22, 22, 36);
    ctx.fillStyle=shade(b.roof,-40);
    ctx.fillRect(chx-3, chy-26, 28, 7); // chimney cap
    ctx.font='14px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('💨', chx+11, chy-34);

    // Dormer window (small window in roof)
    const dmx = sx+b.w*.28, dmy = roofPeak+bh*.12;
    ctx.fillStyle=shade(b.color, 10);
    ctx.beginPath();
    ctx.moveTo(dmx-18, dmy+22); ctx.lineTo(dmx, dmy); ctx.lineTo(dmx+18, dmy+22); ctx.closePath();
    ctx.fill(); ctx.stroke();
    const dlit = ctx.createLinearGradient(dmx-12,dmy+4,dmx-12,dmy+20);
    dlit.addColorStop(0,'#fff8e1'); dlit.addColorStop(1,'#ffe082');
    ctx.fillStyle=dlit; ctx.fillRect(dmx-12, dmy+4, 24, 18);
    ctx.strokeStyle='white'; ctx.lineWidth=3; ctx.strokeRect(dmx-12, dmy+4, 24, 18);

    // Facade texture: clapboard siding
    ctx.save(); ctx.beginPath(); ctx.rect(sx,by,b.w,bh); ctx.clip();
    ctx.strokeStyle='rgba(0,0,0,.09)'; ctx.lineWidth=2;
    for (let yy=by+12; yy<groundY; yy+=14) {
      ctx.beginPath(); ctx.moveTo(sx,yy); ctx.lineTo(sx+b.w,yy); ctx.stroke();
    }
    ctx.restore();

    // Side wall shading
    const sg = ctx.createLinearGradient(sx,by,sx+b.w,by);
    sg.addColorStop(0,'rgba(255,255,255,.08)');
    sg.addColorStop(1,'rgba(0,0,0,.12)');
    ctx.fillStyle=sg; ctx.fillRect(sx,by,b.w,bh);

    // Porch / steps
    ctx.fillStyle=shade(b.color, -18);
    ctx.fillRect(sx+b.w*.18, groundY-6, b.w*.64, 8); // porch step 1
    ctx.fillStyle=shade(b.color, -10);
    ctx.fillRect(sx+b.w*.22, groundY-14, b.w*.56, 9); // porch step 2
    // Porch posts
    ctx.fillStyle=shade(b.color,15);
    ctx.fillRect(sx+b.w*.24, groundY-bh*.18, 7, bh*.17);
    ctx.fillRect(sx+b.w*.72, groundY-bh*.18, 7, bh*.17);
    // Porch roof
    ctx.fillStyle=shade(b.roof, 10);
    ctx.fillRect(sx+b.w*.2, groundY-bh*.18, b.w*.6, 8);

    // Flower boxes under windows
    const winW2 = b.w*.22, winH2 = Math.min(bh*.22, bh*.3);
    for (let ci=0; ci<2; ci++) {
      const wx2 = sx + b.w*.08 + ci*b.w*.36, wy2 = by+bh*.14;
      ctx.fillStyle='#8d6e63'; ctx.fillRect(wx2-3, wy2+winH2, winW2+6, 7);
      ctx.font='11px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🌷', wx2+winW2*.28, wy2+winH2+2);
      ctx.fillText('🌼', wx2+winW2*.7,  wy2+winH2+2);
    }

    // Garden fence at base
    ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(sx, groundY); ctx.lineTo(sx+b.w, groundY); ctx.stroke();
    const fposts = 10;
    for (let fp=0; fp<=fposts; fp++) {
      const fx2 = sx + fp*(b.w/fposts);
      ctx.beginPath(); ctx.moveTo(fx2, groundY-16); ctx.lineTo(fx2, groundY+4); ctx.stroke();
      // picket top
      ctx.beginPath(); ctx.moveTo(fx2, groundY-16);
      ctx.arc(fx2, groundY-17, 4, 0, Math.PI*2); ctx.fillStyle='rgba(255,255,255,.7)'; ctx.fill();
    }
    ctx.beginPath(); ctx.moveTo(sx, groundY-8); ctx.lineTo(sx+b.w, groundY-8); ctx.stroke();

  } else {
    // flat parapet roof with cornice
    ctx.fillStyle=b.roof;
    ctx.fillRect(sx-8, by-14, b.w+16, 18);
    ctx.fillStyle=shade(b.roof,-18);
    ctx.fillRect(sx-8, by+2, b.w+16, 5);
  }

  // ── Upper windows (lit, with frames) ──
  const upperBottom = by + bh*.46;
  const winW=b.w*.22, winH=Math.min(bh*.22, (upperBottom-by-bh*.1));
  if (winH>10) {
    const winCount = (b.style==='house') ? 2 : 3;
    const winSpacing = (b.style==='house') ? b.w*.36 : b.w*.3;
    // Centre the windows: total span = (count-1)*spacing + winW
    const totalSpan = (winCount-1)*winSpacing + winW;
    const winStartX = (b.w - totalSpan) / 2;
    for (let ci=0;ci<winCount;ci++) {
      const wx=sx+winStartX+ci*winSpacing, wy=by+bh*.14;
      // glass with warm light
      const lit = ctx.createLinearGradient(wx,wy,wx,wy+winH);
      lit.addColorStop(0,'#fff8e1'); lit.addColorStop(1,'#ffe082');
      ctx.fillStyle=lit; ctx.fillRect(wx,wy,winW,winH);
      // frame
      ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.strokeRect(wx,wy,winW,winH);
      ctx.strokeStyle='rgba(120,90,60,.5)'; ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(wx+winW/2,wy);ctx.lineTo(wx+winW/2,wy+winH);
      ctx.moveTo(wx,wy+winH/2);ctx.lineTo(wx+winW,wy+winH/2);
      ctx.stroke();
    }
  }

  // ── Storefront: big glass window with a display of goods (shops only) ──
  const sfTop = by + bh*.5;
  const sfH = groundY - sfTop - 6;
  const d = buildingDoorRect(b);
  const doorLeft = d.x - cam();
  if (b.style!=='house' && sfH>20) {
    // glass to the LEFT of the door
    const glassX = sx+10, glassW = doorLeft - (sx+10) - 8;
    if (glassW>24) drawStorefront(glassX, sfTop, glassW, sfH, b);
    // glass to the RIGHT of the door
    const glassX2 = doorLeft + d.w + 8, glassW2 = (sx+b.w-10) - glassX2;
    if (glassW2>24) drawStorefront(glassX2, sfTop, glassW2, sfH, b);
  }

  // ── Awning (striped) over the storefront ──
  if (b.awning && b.style!=='house') {
    drawAwning(sx+4, sfTop-6, b.w-8, bh*.1, b.awning);
  }

  // ── Door ──
  const glow=.5+.5*Math.sin(t*2.2);
  ctx.save();
  ctx.shadowColor=`rgba(255,230,90,${.4+.5*glow})`;
  ctx.shadowBlur=16+glow*10;
  ctx.fillStyle=b.doorColor;
  roundRectPath(doorLeft,d.y,d.w,d.h,8); ctx.fill();
  ctx.restore();
  // door panels
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=2;
  ctx.strokeRect(doorLeft+8,d.y+10,d.w-16,d.h*.4-8);
  ctx.strokeRect(doorLeft+8,d.y+d.h*.45,d.w-16,d.h*.45-8);
  // handle
  ctx.beginPath();
  ctx.arc(doorLeft+d.w*.8,d.y+d.h*.52,4,0,Math.PI*2);
  ctx.fillStyle='#ffd54f'; ctx.fill();

  // ── Hanging sign board ──
  const signW = Math.min(b.w*.8, 200), signH = 30;
  const signX = sx+b.w/2-signW/2, signY = (b.style==='house'? by-bh*.06 : by-bh*.02);
  ctx.fillStyle='rgba(40,30,30,.9)';
  roundRectPath(signX, signY, signW, signH, 8); ctx.fill();
  ctx.fillStyle='#ffe082';
  ctx.font='bold 16px Comic Sans MS, cursive';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(b.sign||b.name, sx+b.w/2, signY+signH/2);
}

// Striped fabric awning with scalloped bottom edge
function drawAwning(x,y,w,h,color) {
  const stripes = Math.max(4, Math.round(w/26));
  const sw = w/stripes;
  for (let i=0;i<stripes;i++) {
    ctx.fillStyle = (i%2===0) ? color : '#fff';
    ctx.beginPath();
    ctx.moveTo(x+i*sw, y);
    ctx.lineTo(x+(i+1)*sw, y);
    ctx.lineTo(x+(i+1)*sw, y+h*.7);
    ctx.lineTo(x+i*sw+sw/2, y+h);   // scallop point
    ctx.lineTo(x+i*sw, y+h*.7);
    ctx.closePath();
    ctx.fill();
  }
  // top bar
  ctx.fillStyle=shade(color,-30);
  ctx.fillRect(x-2,y-4,w+4,6);
}

// A storefront glass pane with goods displayed inside
function drawStorefront(x,y,w,h,b) {
  // glass with reflection
  const g = ctx.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,'rgba(180,225,245,.85)');
  g.addColorStop(.5,'rgba(225,245,255,.7)');
  g.addColorStop(1,'rgba(150,200,225,.85)');
  ctx.fillStyle=g;
  ctx.fillRect(x,y,w,h);
  // diagonal shine
  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=8;
  ctx.beginPath(); ctx.moveTo(x-10,y+h*.6); ctx.lineTo(x+w*.5,y-10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+w*.3,y+h+10); ctx.lineTo(x+w*.9,y+h*.2); ctx.stroke();
  ctx.restore();
  // display goods sitting on a shelf inside
  const goods = WINDOW_GOODS[b.id] || ['🛍️'];
  ctx.font=Math.min(h*.42,26)+'px serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const n = Math.max(1, Math.floor(w/26));
  for (let i=0;i<n;i++) {
    const gx = x + (i+.5)*(w/n);
    ctx.fillText(goods[i%goods.length], gx, y+h*.6);
  }
  // shelf line
  ctx.strokeStyle='rgba(120,90,60,.4)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x,y+h*.8); ctx.lineTo(x+w,y+h*.8); ctx.stroke();
  // frame
  ctx.strokeStyle='#fff'; ctx.lineWidth=5; ctx.strokeRect(x,y,w,h);
}

// What shows in each shop's window display
const WINDOW_GOODS = {
  cafe:   ['☕','🧁','🍰','🥐'],
  pizza:  ['🍕','🍝','🥤','🍔'],
  market: ['🍎','🥦','🥛','🍞','🧀'],
  pet:    ['🐶','🐱','🐟','🦴'],
  toy:    ['🧸','🚂','🎮','🪀'],
  school: ['📚','✏️','🎨','🌍'],
};

function drawPark(b,t) {

  ctx.fillText('🌳',sx+280,H*.68);
  ctx.font='80px serif';
  ctx.fillText('🛝',sx+180,H*.7);
  ctx.font='34px serif';
  ctx.fillText('🌷',sx+110,H*.755);
  ctx.fillText('🌻',sx+350,H*.755);
  ctx.fillText('🌼',sx+560,H*.755);

function drawStreetDeco(t) {
  const deco=[[640,'🚏',46],[1090,'🌳',56],[1540,'🚦',48],[2090,'🌳',54],[2540,'🛵',46],[2990,'🌳',54],[3450,'⛲',64],[140,'🪧',40],[4600,'🌳',58]];
  ctx.textAlign='center'; ctx.textBaseline='middle';

  }
  // street lamps along the sidewalk
  ctx.font='40px serif';
  for (let x=400;x<STREET_W;x+=900) {

// ════════════════════════════════════════════
// DRAW MULTI-ROOM INTERIORS
// ════════════════════════════════════════════
function drawInterior(id,t) {
  const I = INTERIORS[id];
  const RW = roomW();

  for (let n=0; n<I.rooms.length; n++) {
    const room = I.rooms[n];
    const rx = n*RW - cam();
    if (rx+RW<-60||rx>W+60) continue;

    // Walls
    const wg = ctx.createLinearGradient(0,0,0,H*.78);
    wg.addColorStop(0,room.wall); wg.addColorStop(1,room.wall2);
    ctx.fillStyle=wg;
    ctx.fillRect(rx,0,RW,H*.78);

    // Floor
    const fg = ctx.createLinearGradient(0,H*.78,0,H);
    fg.addColorStop(0,room.floor); fg.addColorStop(1,shade(room.floor,-25));
    ctx.fillStyle=fg;
    ctx.fillRect(rx,H*.78,RW,H*.22);

    // Floor boards
    ctx.strokeStyle='rgba(0,0,0,.12)'; ctx.lineWidth=2;
    for (let i=1;i<6;i++) {
      ctx.beginPath();
      ctx.moveTo(rx,H*.78+i*(H*.22/6));
      ctx.lineTo(rx+RW,H*.78+i*(H*.22/6));
      ctx.stroke();
    }
    // Baseboard
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.fillRect(rx,H*.772,RW,8);

    // Wall divider with archway between rooms
    if (n>0) {
      ctx.fillStyle='rgba(120,80,50,.85)';
      ctx.fillRect(rx-9,0,18,H);
      // Archway opening
      ctx.save();
      ctx.fillStyle=room.wall2;
      ctx.beginPath();
      ctx.ellipse(rx,H*.6,52,H*.22,0,Math.PI*1.5,Math.PI*.5);
      ctx.fill();
      ctx.fillRect(rx-1,H*.6,2,H*.18);
      ctx.restore();
    }

    // Window with sky in each room
    const winX = rx+RW*.72, winY = H*.3;
    ctx.fillStyle = nightMode[id] ? '#1a237e' : '#90caf9';
    roundRectPath(winX,winY,RW*.18,H*.22,12); ctx.fill();
    ctx.strokeStyle='white'; ctx.lineWidth=6;
    ctx.strokeRect(winX,winY,RW*.18,H*.22);
    ctx.beginPath();
    ctx.moveTo(winX+RW*.09,winY);ctx.lineTo(winX+RW*.09,winY+H*.22);
    ctx.moveTo(winX,winY+H*.11);ctx.lineTo(winX+RW*.18,winY+H*.11);
    ctx.stroke();
    ctx.font='26px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(nightMode[id]?'🌙':'☀️', winX+RW*.05, winY+H*.05);
    if (!nightMode[id]) ctx.fillText('☁️', winX+RW*.13+Math.sin(t*.4)*5, winY+H*.08);
    else ctx.fillText('⭐', winX+RW*.13, winY+H*.08);

    // Room name
    ctx.font='bold 19px Comic Sans MS, cursive';
    ctx.fillStyle='rgba(0,0,0,.45)';
    ctx.fillText(room.name, rx+RW/2, 30);

    // Rug in middle of room
    ctx.save();
    ctx.globalAlpha=.5;
    ctx.fillStyle=shade(room.floor,40);
    ctx.beginPath();
    ctx.ellipse(rx+RW*.45,H*.86,RW*.22,H*.05,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    // Shelves / counters / tables — the furniture items rest on
    drawSurfaces(room, rx, RW);
  }

  // Title bar
  ctx.font='bold 23px Comic Sans MS, cursive';
  ctx.fillStyle='rgba(0,0,0,.55)';
  ctx.textAlign='center';
  ctx.fillText(I.title + '  ·  room ' + (Math.floor((cam()+W/2)/RW)+1) + ' of ' + I.rooms.length, W/2, 62);

  // Exit door — only visible in first room
  const ex = exitDoorRect();
  const exScreenX = ex.x - cam();
  if (exScreenX > -ex.w-20 && exScreenX < W+20) {
    const glow=.5+.5*Math.sin(t*2.5);
    ctx.save();
    ctx.shadowColor=`rgba(120,220,120,${.5+.4*glow})`;
    ctx.shadowBlur=18+glow*8;
    ctx.fillStyle='#66bb6a';
    roundRectPath(exScreenX,ex.y,ex.w,ex.h,14); ctx.fill();
    ctx.restore();
    ctx.font='34px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🚪', exScreenX+ex.w/2, ex.y+ex.h*.4);
    ctx.font='bold 14px Comic Sans MS, cursive';
    ctx.fillStyle='white';
    ctx.fillText('Outside', exScreenX+ex.w/2, ex.y+ex.h*.78);
  }
}

function exitDoorRect() {
  return { x:18, y:H*.8, w:88, h:86 }; // world coords (first room)
}

// ── Draw a room's shelves, counters & tables ──
function drawSurfaces(room, rx, RW) {
  if (!room.surfaces) return;
  const FLOOR = H*.78;
  for (const s of room.surfaces) {
    const x = rx + RW*s.fx, w = RW*s.fw, y = H*s.fy;
    if (s.t==='shelf') {
      // wall shelf: board + brackets + soft shadow
      ctx.fillStyle='rgba(0,0,0,.12)';
      ctx.fillRect(x+4, y+9, w, 5);
      ctx.fillStyle='#8d6e63';
      roundRectPath(x, y, w, 9, 4); ctx.fill();
      ctx.fillStyle='#6d4c41';
      ctx.fillRect(x+10, y+9, 7, 16);
      ctx.fillRect(x+w-17, y+9, 7, 16);
    } else if (s.t==='counter') {
      // counter / cabinet: solid base down to the floor + worktop
      const hgt = FLOOR - y;
      ctx.fillStyle='#a1887f';
      ctx.fillRect(x, y, w, hgt);
      // cupboard door panels
      ctx.fillStyle='rgba(255,255,255,.18)';
      ctx.fillRect(x+8,  y+14, w/2-14, hgt-24);
      ctx.fillRect(x+w/2+6, y+14, w/2-14, hgt-24);
      // handles
      ctx.fillStyle='#ffd54f';
      ctx.beginPath();
      ctx.arc(x+w*.28, y+hgt*.42, 4, 0, Math.PI*2);
      ctx.arc(x+w*.72, y+hgt*.42, 4, 0, Math.PI*2);
      ctx.fill();
      // worktop
      ctx.fillStyle='#6d4c41';
      roundRectPath(x-6, y-9, w+12, 12, 5); ctx.fill();
    } else if (s.t==='table') {
      // table: top + two legs
      ctx.fillStyle='#795548';
      ctx.fillRect(x+10,   y, 9, FLOOR-y);
      ctx.fillRect(x+w-19, y, 9, FLOOR-y);
      ctx.fillStyle='#8d6e63';
      roundRectPath(x-4, y-10, w+8, 12, 6); ctx.fill();
    } else if (s.t==='unit') {
      // Supermarket gondola: a tall freestanding shelving unit with 3 tiers
      const hgt = FLOOR - y;
      // back panel
      ctx.fillStyle='#cfd8dc';
      roundRectPath(x, y, w, hgt, 4); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=2;
      roundRectPath(x, y, w, hgt, 4); ctx.stroke();
      // 3 shelf boards
      ctx.fillStyle='#90a4ae';
      for (let tier=1; tier<=3; tier++) {
        const ty = y + (hgt/3)*tier - 6;
        ctx.fillRect(x+2, ty, w-4, 6);
        ctx.fillStyle='rgba(0,0,0,.12)';
        ctx.fillRect(x+2, ty+6, w-4, 3);
        ctx.fillStyle='#90a4ae';
      }
      // price label strip
      ctx.fillStyle='#ffeb3b';
      ctx.fillRect(x+2, y+hgt-14, w-4, 10);
    } else if (s.t==='fridge') {
      // Tall fridge: white double-door appliance
      const hgt = FLOOR - y;
      ctx.fillStyle='#eceff1';
      roundRectPath(x, y, w, hgt, 8); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.2)'; ctx.lineWidth=2;
      roundRectPath(x, y, w, hgt, 8); ctx.stroke();
      // door split (freezer top, fridge bottom)
      ctx.strokeStyle='rgba(0,0,0,.15)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x, y+hgt*.32); ctx.lineTo(x+w, y+hgt*.32); ctx.stroke();
      // handles
      ctx.fillStyle='#90a4ae';
      ctx.fillRect(x+w-8, y+hgt*.08, 4, hgt*.18);
      ctx.fillRect(x+w-8, y+hgt*.4, 4, hgt*.3);
      // snowflake on freezer
      ctx.font=(w*.4)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#4fc3f7';
      ctx.fillText('❄️', x+w/2, y+hgt*.18);
    }
  }
}

function roundRectPath(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function shade(hex,amt) {
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return `rgb(${r},${g},${b})`;
}

// ════════════════════════════════════════════
// NIGHT OVERLAY (when lamp is off at night mode)
// ════════════════════════════════════════════
function drawNight() {
  if (scene==='street'||!nightMode[scene]) return;
  ctx.save();
  ctx.fillStyle='rgba(20,16,60,.45)';
  ctx.fillRect(0,0,W,H);
  // Light circles around lamps that are on
  ctx.globalCompositeOperation='destination-out';
  for (const it of visibleItems()) {
    if (it.special==='lamp'&&it.on) {
      const g=ctx.createRadialGradient(it.cx,it.cy,10,it.cx,it.cy,H*.3);
      g.addColorStop(0,'rgba(0,0,0,.85)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(it.cx,it.cy,H*.3,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
}

// ════════════════════════════════════════════
// POPS
// ════════════════════════════════════════════
function popEmoji(sx,sy,em) {
  const el=document.createElement('div');
  el.className='pop'; el.textContent=em;
  el.style.left=(sx-25)+'px'; el.style.top=(sy-25)+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),950);
}

// ════════════════════════════════════════════
// SCENE TRANSITIONS
// ════════════════════════════════════════════
let fadeAlpha=0, fadeTarget=0, pendingScene=null;
function goToScene(s) { pendingScene=s; fadeTarget=1; SFX.door(); }
function updateFade() {
  fadeAlpha += (fadeTarget-fadeAlpha)*.25;
  if (fadeTarget===1 && fadeAlpha>.95) {
    scene=pendingScene; pendingScene=null; fadeTarget=0;
    if (!(scene in cams)) cams[scene]=0;
    if (scene!=='street') {
      chars.filter(c=>c.scene===scene).forEach((c,i)=>{
        if (c.x<50||c.x>sceneW()-50||c.y>H*.95) {
          c.x=W*.3+i*W*.15; c.y=H*.7; c.baseY=c.y;
        }
      });
    }
  }
}
function drawFade() {
  if (fadeAlpha<.02) return;
  ctx.fillStyle=`rgba(40,30,60,${fadeAlpha})`;
  ctx.fillRect(0,0,W,H);
}

// ════════════════════════════════════════════
// SPECIAL ITEM BEHAVIOURS
// ════════════════════════════════════════════
function tapSpecial(item) {
  switch (item.special) {
    case 'lamp':
      item.on = !item.on;
      nightMode[scene] = !item.on; // lamp off = night time in this building
      SFX.switch();
      popEmoji(item.cx, item.cy-40, item.on?'💡':'🌙');
      return true;
    case 'tv':
      item.on = !item.on;
      SFX.tv();
      popEmoji(item.cx, item.cy-50, item.on?'📺':'🔇');
      return true;
    case 'drum':
      SFX.boing();
      popEmoji(item.cx, item.cy-40, ['🎵','🎶'][Math.floor(Math.random()*2)]);
      item.wiggle=16; item.targetScale=1.3;
      return true;
    case 'piano':
      beep([[523,0,.15],[659,.12,.15],[784,.24,.2]],'sine',.25);
      popEmoji(item.cx, item.cy-46, '🎵');
      item.wiggle=8; item.targetScale=1.2;
      return true;
    case 'stove':
      SFX.sizzle();
      popEmoji(item.cx, item.cy-40, '♨️');
      item.wiggle=10; item.targetScale=1.2;
      return true;
    case 'bath':
      SFX.bubble();
      for (let i=0;i<4;i++)
        setTimeout(()=>popEmoji(item.cx+(Math.random()-.5)*60, item.cy-30-Math.random()*30,'🫧'), i*120);
      return true;
  }
  return false;
}

// ── Find the surface lines (shelves/counters/floor) under a world X ──
function surfaceLinesAt(worldX) {
  if (scene==='street') return [H*.775];
  const lines = [H*.78]; // interior floor
  const I = INTERIORS[scene];
  if (!I) return lines;
  const RW = roomW();
  const n = Math.max(0, Math.min(I.rooms.length-1, Math.floor(worldX/RW)));
  const room = I.rooms[n];
  const fx = (worldX - n*RW) / RW;
  for (const s of (room.surfaces||[])) {
    if (fx >= s.fx-.03 && fx <= s.fx+s.fw+.03) lines.push(H*s.fy);
  }
  return lines;
}

// Things that are allowed to float (balloons, kites, butterflies)
const FLOATY = new Set(['🎈','🪁','🦋','🕊️','🐦']);

// Snap a loose item's bottom onto the nearest shelf / counter / floor
function snapFree(it) {
  if (FLOATY.has(it.emoji)) return;
  const lines = surfaceLinesAt(it.x);
  // For 'free' items, y is the centre. Bottom = y + size*scale*0.5
  const bottom = it.y + it.size * it.scale * .5;
  let best = lines[0], bd = Math.abs(bottom - lines[0]);
  for (const L of lines) {
    const d = Math.abs(bottom - L);
    if (d < bd) { bd = d; best = L; }
  }
  // Place so bottom of item sits exactly on the surface line
  it.y = best - it.size * it.scale * .5;
  it.targetScale = 1.15;
}

function dropOnSpecial(dropped, target) {
  const ty = target.drawCy;  // visual centre of furniture
  // Character on bed → sleep
  if (target.special==='bed' && dropped instanceof Char) {
    dropped.dropAll();
    dropped.x = target.x; dropped.y = ty - target.r*.35;
    dropped.baseY = dropped.y;
    dropped.sleeping = true;
    SFX.snore();
    popEmoji(target.cx, ty-target.r, '💤');
    return true;
  }
  // Character or duck in bath → bubbles!
  if (target.special==='bath') {
    SFX.bubble();
    for (let i=0;i<6;i++)
      setTimeout(()=>popEmoji(target.cx+(Math.random()-.5)*70, ty-20-Math.random()*50,'🫧'), i*100);
    if (dropped instanceof Char) {
      dropped.x = target.x; dropped.y = ty - target.r*.2;
      dropped.baseY = dropped.y;
      dropped.bounce();
    }
    return true;
  }
  // Food on stove → cooking!
  if (target.special==='stove' && dropped instanceof Item) {
    SFX.sizzle();
    popEmoji(target.cx, ty-46, '♨️');
    popEmoji(target.cx+24, ty-70, '😋');
    return true;
  }
  return false;
}

// ════════════════════════════════════════════
// INPUT
// ════════════════════════════════════════════
let grabbed=null, grabOffX=0, grabOffY=0;
let pointerDown=false, moved=false, startX=0, startCam=0;
let camVel=0, camTarget=null, lastPX=0, lastPT=0;   // flick momentum + smooth paging

function visibleChars() { return chars.filter(c=>c.scene===scene); }
function visibleItems() { return items.filter(i=>i.scene===scene); }
function grabbableItems() { return items.filter(i=>i.scene===scene && !i.heldBy); }

// Prevent canvas touch events from swallowing UI interactions
['palette','shop','toolbar'].forEach(id=>{
  const el=document.getElementById(id);
  if (!el) return;
  ['pointerdown','touchstart','touchend','click'].forEach(ev=>
    el.addEventListener(ev, e=>{ e.stopPropagation(); }, {passive:false})
  );
});

canvas.addEventListener('pointerdown', e => {
  // Only process if the touch actually started ON the canvas
  if (e.target !== canvas) return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  pointerDown=true; moved=false;
  startX=e.clientX; startCam=cam();
  camVel=0; camTarget=null;
  lastPX=e.clientX; lastPT=performance.now();
  const sx=e.clientX, sy=e.clientY;

  // Scroll arrows — big, easy targets that glide a full page
  if (cam()>10 && Math.hypot(sx-46,sy-H/2)<58) {
    camTarget = Math.max(0, cam()-W*.75); SFX.pop(); return;
  }
  if (cam()<sceneW()-W-10 && Math.hypot(sx-(W-46),sy-H/2)<58) {
    camTarget = Math.min(sceneW()-W, cam()+W*.75); SFX.pop(); return;
  }

  // Exit door inside
  if (scene!=='street') {
    const ex=exitDoorRect();
    const exsx = ex.x - cam();
    if (sx>exsx&&sx<exsx+ex.w&&sy>ex.y&&sy<ex.y+ex.h) { goToScene('street'); return; }
  }

  const all=[...visibleChars(),...grabbableItems()].sort((a,b)=>(b.z||0)-(a.z||0));
  for (const o of all) {
    if (o.hit(sx,sy)) {
      const oy = (o instanceof Item) ? o.drawCy : o.cy;
      grabbed=o; grabOffX=sx-o.cx; grabOffY=sy-oy;
      o.dragged=true; o.z=10; o.wiggle=12; o.targetScale=1.22;
      if (o instanceof Char) { o.sleeping=false; SFX.squeak(); } else SFX.pop();
      return;
    }
  }
});

canvas.addEventListener('pointermove', e => {
  e.preventDefault();
  if (!pointerDown) return;
  if (Math.abs(e.clientX-startX)>6) moved=true;

  if (grabbed) {
    grabbed.x = e.clientX-grabOffX+cam();
    const vy = e.clientY-grabOffY;            // desired visual centre
    if (grabbed instanceof Item && grabbed.place==='floor') {
      grabbed.y = vy + grabbed.size*grabbed.scale*.5;  // store as base
    } else {
      grabbed.y = vy;
    }
    grabbed.wiggle = Math.max(-15,Math.min(15,(e.movementX||0)*.6));
    // Cart carries its cargo along
    if (grabbed instanceof Item && grabbed.isCart && grabbed.cargo && grabbed.cargo.length) {
      positionCargo(grabbed);
    }
    if (e.clientX<80)  setCam(cam()-11);
    if (e.clientX>W-80) setCam(cam()+11);
  } else {
    // Pan the camera + measure flick speed for momentum
    const now = performance.now();
    const dms = Math.max(1, now-lastPT);
    camVel = -((e.clientX-lastPX)/dms)*1000;
    lastPX = e.clientX; lastPT = now;
    setCam(startCam+(startX-e.clientX));
  }
});

canvas.addEventListener('pointerup', e => {
  e.preventDefault();
  pointerDown=false;
  // Only keep momentum if the finger was still moving when lifted
  if (performance.now()-lastPT > 90) camVel=0;
  if (!grabbed) return;
  camVel=0;

  const g=grabbed;
  g.dragged=false;
  g.z = g instanceof Char ? 1 : 0;
  g.targetScale=1;
  grabbed=null;
  setTimeout(()=>{ if(typeof saveWorld==='function') saveWorld(); }, 50);

  const sx=e.clientX, sy=e.clientY;

  // Character → building door (street)
  if (g instanceof Char && scene==='street') {
    for (const b of BUILDINGS) {
      if (b.id==='park') continue;
      const d=buildingDoorRect(b);
      const dx=d.x-cam();
      if (sx>dx-26&&sx<dx+d.w+26&&sy>d.y-30&&sy<d.y+d.h+20) {
        g.scene=b.id;
        g.x=W*.35+Math.random()*W*.3; g.y=H*.7; g.baseY=g.y;
        g.held.forEach(it=>it.scene=b.id);
        popEmoji(sx,sy-40,'🚪'); popEmoji(sx,sy-90,'✨');
        SFX.door();
        setTimeout(()=>goToScene(b.id),350);
        return;
      }
    }
    // Drop back to the ground — they fall with a fun bounce
    g.baseY = H*.72;
  }

  // Character → exit door (interior)
  if (g instanceof Char && scene!=='street') {
    const ex=exitDoorRect();
    const exsx=ex.x-cam();
    if (sx>exsx-20&&sx<exsx+ex.w+20&&sy>ex.y-20&&sy<ex.y+ex.h+20) {
      g.scene='street';
      const b=BUILDINGS.find(bb=>bb.id===scene);
      g.x=b?b.x+b.w/2:cam()+W/2;
      g.y=H*.72; g.baseY=g.y;
      g.held.forEach(it=>it.scene='street');
      popEmoji(sx,sy-40,'🚪');
      SFX.door();
      setTimeout(()=>goToScene('street'),350);
      return;
    }
    // Drop back to the floor — they fall with a fun bounce
    g.baseY = H*.70;
  }

  // Drop onto special targets (bed, bath, stove)
  for (const it of visibleItems()) {
    if (it===g||!it.special) continue;
    if (Math.hypot(g.cx-it.cx,g.cy-it.drawCy)<g.r+it.r*.9) {
      if (dropOnSpecial(g,it)) return;
    }
  }

  // Items: feed OR hand to character to carry (only loose/free objects)
  if (g instanceof Item && g.place==='free') {
    SFX.place();
    g.targetScale=1.3;
    // Dropped onto a cart/basket? Load it in so it travels with the cart.
    if (!g.isCart) {
      for (const other of grabbableItems()) {
        if (other===g || !other.isCart) continue;
        if (Math.hypot(g.cx-other.cx, g.cy-other.cy) < other.r*1.4) {
          // detach from any previous cart
          items.forEach(c=>{ if(c.cargo) c.cargo=c.cargo.filter(x=>x!==g); });
          if (other.cargo.length < 8) {
            g.inCart = other; other.cargo.push(g);
            positionCargo(other);
            popEmoji(other.cx, other.cy-other.r, '🛒'); SFX.pop();
            saveWorld(); return;
          }
        }
      }
    }
    // If this item WAS in a cart and got pulled out, release it
    if (g.inCart) {
      g.inCart.cargo = g.inCart.cargo.filter(x=>x!==g);
      g.inCart = null;
    }
    for (const ch of visibleChars()) {
      if (Math.hypot(g.cx-ch.cx,g.cy-ch.cy)<ch.r+g.r*.7) {
        const foods=['🍕','🍝','🥤','🧁','🍔','🍰','☕','🍎','🍦','🍪','🥛','🦴','🥫','🍌','🥚','🍭','🧀','🍅','🫕','🍳','🍇','🍓','🍊','🥕','🥦','🌽','🥬','🍚','🧃','🍞','🧈','🍫','🥐','🥖','🥯','🍬','🎂'];
        if (foods.includes(g.emoji)) {
          // EAT — food gets consumed
          ch.bounce(); ch.showEmotion('😋');
          popEmoji(ch.cx,ch.cy-ch.r,'😋');
          for(let i=0;i<3;i++) setTimeout(()=>popEmoji(ch.cx+(Math.random()-.5)*40,ch.cy-ch.r*.5,'😋'),i*150);
          if (g.heldBy){ g.heldBy.held=g.heldBy.held.filter(x=>x!==g); g.heldBy=null; }
          g.eaten=true; g.scene='__gone__';
          saveWorld();
          return;
        } else {
          // HAND IT OVER — character carries it
          if (g.heldBy){ g.heldBy.held=g.heldBy.held.filter(x=>x!==g); g.heldBy=null; }
          if (ch.pickUp(g)) { popEmoji(ch.cx,ch.cy-ch.r,'🤲'); saveWorld(); return; }
        }
      }
    }
    // Nothing caught it → settle onto the nearest shelf, counter or floor
    snapFree(g);
  }

  // Floor furniture → snap its base to the floor line
  if (g instanceof Item && g.place==='floor') {
    SFX.place();
    g.targetScale=1.1;
    const FLOOR = scene==='street' ? H*.775 : H*.78;
    g.y = FLOOR + g.size*g.scale*.5;
    popEmoji(g.cx, g.cy-g.r, '✨');
  }
  // Wall items → keep them up on the wall (don't let them sink to floor)
  if (g instanceof Item && g.place==='wall') {
    SFX.place();
    g.y = Math.min(g.y, H*.55);
  }

  // Char on char → play
  if (g instanceof Char) {
    for (const ch of visibleChars()) {
      if (ch===g) continue;
      if (Math.hypot(g.cx-ch.cx,g.cy-ch.cy)<g.r+ch.r*.75) {
        g.bounce(); ch.bounce();
        popEmoji((g.cx+ch.cx)/2,Math.min(g.cy,ch.cy)-40,['💕','🎵','🌈','🎊'][Math.floor(Math.random()*4)]);
        return;
      }
    }
  }
});

canvas.addEventListener('click', e => {
  if (moved) return;
  const sx=e.clientX, sy=e.clientY;

  if (scene==='street') {
    for (const b of BUILDINGS) {
      if (b.id==='park') continue;
      const d=buildingDoorRect(b);
      const dx=d.x-cam();
      if (sx>dx-15&&sx<dx+d.w+15&&sy>d.y-20&&sy<d.y+d.h+15) { goToScene(b.id); return; }
    }
  }

  for (const o of [...visibleChars(),...visibleItems()]) {
    if (o.hit(sx,sy)) {
      // Customization tools take priority on characters
      if (o instanceof Char && (tool==='color'||tool==='hat')) {
        if (applyCustomize(o)) return;
      }
      // Special items first
      if (o instanceof Item && o.special && tapSpecial(o)) return;
      o.targetScale=1.32; o.wiggle=14;
      if (o instanceof Char) {
        if (o.sleeping) { o.sleeping=false; popEmoji(sx,sy-40,'☀️'); SFX.happy(); return; }
        o.happy=.8; SFX.squeak();
        o.showEmotion(['😊','😄','🥰','😆'][Math.floor(Math.random()*4)]);
        popEmoji(sx,sy-44,['😊','💕','⭐','✨'][Math.floor(Math.random()*4)]);
      } else {
        SFX.boing();
        popEmoji(sx,sy-34,['💥','✨','💫'][Math.floor(Math.random()*3)]);
      }
      return;
    }
  }

  // Tapped empty space with COLOUR tool in an interior → recolour the wall (wallpaper!)
  if (tool==='color' && pendingValue && scene!=='street' && sy < H*.78) {
    const RW = roomW();
    const n = Math.max(0, Math.min(INTERIORS[scene].rooms.length-1, Math.floor((cam()+sx)/RW)));
    const room = INTERIORS[scene].rooms[n];
    room.wall = pendingValue;
    room.wall2 = shade(pendingValue, -28);
    SFX.happy();
    popEmoji(sx, sy, '🎨');
    saveWorld();
    return;
  }
  // Tapped empty floor with COLOUR tool → recolour the floor
  if (tool==='color' && pendingValue && scene!=='street' && sy >= H*.78) {
    const RW = roomW();
    const n = Math.max(0, Math.min(INTERIORS[scene].rooms.length-1, Math.floor((cam()+sx)/RW)));
    const room = INTERIORS[scene].rooms[n];
    room.floor = pendingValue;
    SFX.happy();
    popEmoji(sx, sy, '🎨');
    saveWorld();
    return;
  }
});

function drawArrows() {
  if (cam()>10) arrowBtn(46,H/2,'◀');
  if (cam()<sceneW()-W-10) arrowBtn(W-46,H/2,'▶');
}
function arrowBtn(x,y,g) {
  ctx.save();
  ctx.beginPath();ctx.arc(x,y,38,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.stroke();
  ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#555';ctx.fillText(g,x,y);
  ctx.restore();
}

const CHAR_TYPES = { Peppa, Dog, Duck, Frog, Bunny };
const COLORS = ['#ff8a80','#ff80ab','#ea80fc','#b388ff','#8c9eff','#80d8ff',
                '#a7ffeb','#b9f6ca','#ffff8d','#ffd180','#ffab91','#bcaaa4'];
const HATS = ['🎩','👑','🧢','🎀','🤠','⛑️','🎓','🥳','🌸','⭐','🦄','❌'];

const palette = document.getElementById('palette');
let pendingValue=null, pendingKind=null;
function showPalette(kind) {
  palette.innerHTML='';
  const list = kind==='color' ? COLORS : HATS;
  // Hint label
  const hint=document.createElement('div');
  hint.style.cssText='width:100%;text-align:center;font-size:13px;color:#444;margin-bottom:2px;font-family:Comic Sans MS,cursive;';
  hint.textContent = kind==='color' ? 'Pick a colour, then tap a character or wall' : 'Pick a hat, then tap a character';
  palette.appendChild(hint);
  list.forEach((v,i) => {
    const el=document.createElement('button'); el.className='swatch';
    el.type='button';
    if (kind==='color'){ el.style.background=v; } else { el.textContent=v; }
    if (i===0) el.style.outline='3px solid #29b6f6';
    const select = (e)=>{
      if(e){ e.preventDefault(); e.stopPropagation(); }
      pendingValue = v; pendingKind = kind;
      palette.querySelectorAll('.swatch').forEach(s=>s.style.outline='none');
      el.style.outline='3px solid #29b6f6';
      SFX.switch();
    };
    el.addEventListener('click', select);
    el.addEventListener('touchstart', select, {passive:false});
    palette.appendChild(el);
  });
  palette.classList.add('show');
}
function hidePalette(){ palette.classList.remove('show'); }

function setTool(t) {
  tool=t;
  ['play','shop','color','hat','add','reset'].forEach(k=>{
    const b=document.getElementById('t-'+k);
    if (b) b.classList.toggle('active', k===t);
  });
  if (t==='color'){ showPalette('color'); pendingKind='color'; pendingValue=COLORS[0]; }
  else if (t==='hat'){ showPalette('hat'); pendingKind='hat'; pendingValue=HATS[0]; }
  else hidePalette();
  if (t==='shop') showShop(); else hideShop();
}
function bindTool(id, fn){
  const el=document.getElementById(id);
  const h=(e)=>{ e.preventDefault(); e.stopPropagation(); fn(); };
  el.addEventListener('click', h);
  el.addEventListener('touchstart', h, {passive:false});
}
bindTool('t-play', ()=>{ setTool('play'); SFX.pop(); });
bindTool('t-shop', ()=>{ setTool('shop'); SFX.door(); });
bindTool('t-color',()=>{ setTool('color'); SFX.pop(); });
bindTool('t-hat',  ()=>{ setTool('hat'); SFX.pop(); });
bindTool('t-add',  ()=>{
  const types=Object.keys(CHAR_TYPES);
  const T=CHAR_TYPES[types[Math.floor(Math.random()*types.length)]];
  const gy = scene==='street'? H*.72 : H*.7;
  const wx = cam()+W*.4+Math.random()*W*.2;
  const ch=new T({ x:wx, y:gy-200, size:H*.16, scene });
  ch.baseY=gy; ch.vy=-100;
  ch.tint = COLORS[Math.floor(Math.random()*COLORS.length)];
  chars.push(ch);
  popEmoji(W*.5,H*.4,'✨'); SFX.tada();
  saveWorld();
});
bindTool('t-reset', ()=>{
  if (confirm('Start the city fresh? This clears your changes.')) {
    localStorage.removeItem(SAVE_KEY);
    location.reload();
  }
});

const shopEl = document.getElementById('shop');
const catsEl = document.getElementById('shop-cats');
const itemsEl = document.getElementById('shop-items');
let shopCat = Object.keys(CATALOG)[0];

function renderShop() {
  catsEl.innerHTML='';
  Object.keys(CATALOG).forEach(name=>{
    const b=document.createElement('button');
    b.className='cat'+(name===shopCat?' active':'');
    b.textContent=name;
    const h=(e)=>{ e.preventDefault(); e.stopPropagation(); shopCat=name; SFX.switch(); renderShop(); };
    b.addEventListener('click', h);
    b.addEventListener('touchstart', h, {passive:false});
    catsEl.appendChild(b);
  });
  itemsEl.innerHTML='';
  CATALOG[shopCat].forEach(em=>{
    const b=document.createElement('button');
    b.className='shop-item'; b.textContent=em;
    const h=(e)=>{ e.preventDefault(); e.stopPropagation(); spawnFurniture(em); };
    b.addEventListener('click', h);
    b.addEventListener('touchstart', h, {passive:false});
    itemsEl.appendChild(b);
  });
}
function showShop(){ renderShop(); shopEl.classList.add('show'); }
function hideShop(){ shopEl.classList.remove('show'); }

// Drop a new decor item into the middle of the current view
function spawnFurniture(emoji) {
  const place = placeOf(emoji, null);
  const big = ['🛋️','🛏️','🛌','🛁','📺','🎠','🎪','🎡','🎢','🚪','🗄️','⛲','🌳','🌲','🌴','🎄','🌵',
    '🚗','🚕','🚙','🚌','🚎','🏎️','🚓','🚑','🚒','🚐','🛻','🚚','🚛','🚜','🚂','🚃','🚄','🚅','✈️','🚁','⛵','🚢',
    '🦁','🐯','🐴','🦄','🐮','🐷','🐘','🦒','🦛','🦏','🐊','🐳','🐋','🐬','🏰','🏯','🗼','🗽','🏥','🏦','🏪','🏫','🏬','🏨','⛪','🕌'].includes(emoji);
  const size = big ? H*.14 : (place==='free' ? H*.06 : H*.09);
  const worldX = cam() + W*0.45 + (Math.random()-.5)*W*0.2;
  let y;
  const FLOOR = scene==='street' ? H*.775 : H*.78;
  if (place==='floor') y = FLOOR + size*.5;
  else if (place==='wall') y = H*.34 + Math.random()*H*.1;
  else y = FLOOR - size*.5;   // loose items rest ON the floor, never float
  const it = new Item({ scene, emoji, x:worldX, y, size, special:specialFor(emoji), place });
  items.push(it);
  it.targetScale=1.35;
  popEmoji(W*.45, H*.45, emoji);
  SFX.place();
  saveWorld();
}
// Give newly-placed special objects their behaviour
function specialFor(emoji) {
  if (emoji==='📺') return 'tv';
  if (emoji==='💡') return 'lamp';
  if (emoji==='🍳') return 'stove';
  if (emoji==='🛏️') return 'bed';
  if (emoji==='🛁') return 'bath';
  if (emoji==='🎹') return 'piano';
  if (emoji==='🥁') return 'drum';
  return null;
}

// Apply customization on character tap when a tool is active
function applyCustomize(ch) {
  if (tool==='color' && pendingValue) {
    ch.tint = pendingValue; SFX.happy();
    popEmoji(ch.cx,ch.cy-ch.r,'🎨'); saveWorld(); return true;
  }
  if (tool==='hat' && pendingValue) {
    ch.hat = pendingValue==='❌' ? null : pendingValue;
    SFX.happy(); popEmoji(ch.cx,ch.cy-ch.r, ch.hat||'🚫'); saveWorld(); return true;
  }
  return false;
}

// ───── Persistence (localStorage) ─────
const SAVE_KEY = 'santiago-city-v6';
let saveTimer=null;
function doSave() {
  try {
    // Capture per-room wall/floor colours
    const roomColors={};
    Object.keys(INTERIORS).forEach(id=>{
      roomColors[id]=INTERIORS[id].rooms.map(r=>({wall:r.wall,wall2:r.wall2,floor:r.floor}));
    });
    const data = {
      chars: chars.map(c=>({
        type:c.constructor.name, x:c.x, y:c.y, baseY:c.baseY, scene:c.scene,
        size:c.size, tint:c.tint, hat:c.hat, sleeping:c.sleeping,
        held: c.held.map(h=>items.indexOf(h))
      })),
      items: items.map(i=>({
        emoji:i.emoji, x:i.x, y:i.y, scene:i.scene, size:i.size,
        special:i.special, on:i.on, eaten:i.eaten||false, place:i.place,
        cargo:(i.cargo||[]).map(c=>items.indexOf(c)).filter(x=>x>=0)
      })),
      nightMode, roomColors
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch(e){}
}
function saveWorld(immediate) {
  clearTimeout(saveTimer);
  if (immediate) { doSave(); return; }
  saveTimer=setTimeout(doSave, 400);
}
function loadWorld() {
  let raw; try { raw=localStorage.getItem(SAVE_KEY); } catch(e){ return false; }
  if (!raw) return false;
  let data; try { data=JSON.parse(raw); } catch(e){ return false; }
  if (!data || !data.items || !data.chars) return false;
  // Items first
  items = data.items.map(d=>{
    const it=new Item({emoji:d.emoji,x:d.x,y:d.y,scene:d.scene,size:d.size,
      special:d.special, place:d.place||placeOf(d.emoji,d.special)});
    it.on=d.on; it.eaten=d.eaten;
    return it;
  });
  // Re-link cart cargo
  data.items.forEach((d,ci)=>{
    (d.cargo||[]).forEach(idx=>{
      const cargoItem=items[idx];
      if (cargoItem && items[ci]){ cargoItem.inCart=items[ci]; items[ci].cargo.push(cargoItem); }
    });
  });
  // Chars
  chars = data.chars.map(d=>{
    const T=CHAR_TYPES[d.type]||Peppa;
    const c=new T({x:d.x,y:d.y,size:d.size,scene:d.scene});
    c.baseY=d.baseY; c.tint=d.tint; c.hat=d.hat; c.sleeping=d.sleeping;
    return c;
  });
  // Re-link held items
  data.chars.forEach((d,ci)=>{
    (d.held||[]).forEach(idx=>{
      const it=items[idx];
      if (it){ it.heldBy=chars[ci]; chars[ci].held.push(it); }
    });
  });
  Object.assign(nightMode, data.nightMode||{});
  // Restore per-room wall/floor colours
  if (data.roomColors) {
    Object.keys(data.roomColors).forEach(id=>{
      if (!INTERIORS[id]) return;
      data.roomColors[id].forEach((rc,i)=>{
        if (INTERIORS[id].rooms[i]) {
          INTERIORS[id].rooms[i].wall = rc.wall;
          INTERIORS[id].rooms[i].wall2 = rc.wall2;
          INTERIORS[id].rooms[i].floor = rc.floor;
        }
      });
    });
  }
  return true;
}

// Try loading saved world over the default setup.
// If a saved world is corrupt or from an incompatible version, fall back
// to the fresh setup instead of crashing to a white screen.
try {
  if (!loadWorld()) saveWorld();
} catch (err) {
  console.warn('Could not load saved world, starting fresh:', err);
  try { localStorage.removeItem(SAVE_KEY); } catch(e){}
  setup();
}
addEventListener('beforeunload', ()=>saveWorld(true));


let last=0;
function loop(ts=0) {
  const dt=Math.min((ts-last)/1000,.05); last=ts;
  ctx.clearRect(0,0,W,H);
  const t=ts*.001;

  // Smooth camera: arrow paging glides, flicks coast with momentum
  if (camTarget!=null) {
    const d = camTarget-cam();
    setCam(cam()+d*Math.min(1,dt*7));
    if (Math.abs(d)<2) camTarget=null;
  } else if (!pointerDown && Math.abs(camVel)>4) {
    setCam(cam()+camVel*dt);
    camVel *= Math.exp(-2.4*dt);
  }

  try {
    if (scene==='street') { drawStreet(t); updateCars(dt); }
    else drawInterior(scene,t);

    for (const it of visibleItems()) { if(it.heldBy) continue; it.update(dt); it.draw(); }
    for (const ch of visibleChars()) { ch.update(dt); ch.draw(); }
    for (const it of visibleItems()) { if(!it.heldBy) continue; it.update(dt); it.draw(); }

    drawNight();
    drawArrows();
    updateFade();
    drawFade();
  } catch (err) {
    console.warn('Frame error (continuing):', err);
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
